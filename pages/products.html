<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveCakeByAnita</title>
    <script src="/assets/js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-cream font-body text-darkBrown antialiased">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-2xl focus:bg-chocolate focus:px-5 focus:py-3 focus:text-sm focus:font-semibold focus:text-white focus:shadow-lg">Lewati ke konten utama</a>

    <header class="sticky top-0 z-40 border-b border-chocolate/10 bg-cream/95 backdrop-blur" role="banner">
      <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
        <a href="/" class="font-heading text-2xl font-semibold text-chocolate focus:outline-none focus:ring-2 focus:ring-chocolate focus:ring-offset-4 focus:ring-offset-cream">LoveCakeByAnita</a>
        <nav id="primary-navigation" class="hidden items-center gap-1 lg:flex" aria-label="Navigasi utama" data-menu-desktop></nav>
        <button type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-full bg-white text-chocolate shadow-lg transition-all duration-300 ease-out hover:bg-softPink focus:outline-none focus:ring-2 focus:ring-chocolate focus:ring-offset-2 focus:ring-offset-cream lg:hidden" aria-label="Buka menu navigasi" aria-controls="mobile-navigation" aria-expanded="false" data-menu-toggle>
          <span class="h-0.5 w-5 rounded-full bg-current before:block before:h-0.5 before:w-5 before:-translate-y-2 before:rounded-full before:bg-current before:content-[''] after:block after:h-0.5 after:w-5 after:translate-y-1.5 after:rounded-full after:bg-current after:content-['']"></span>
        </button>
      </div>
      <nav id="mobile-navigation" class="mx-auto max-w-7xl px-4 pb-5 sm:px-6 lg:hidden" aria-label="Navigasi mobile" data-menu-mobile hidden></nav>
    </header>

    <main id="main-content" class="min-h-[calc(100vh-10rem)]" tabindex="-1">
      <section class="mx-auto max-w-7xl px-4 pt-section sm:px-6 lg:px-8 md:pt-section-lg" data-products-hero aria-label="Products catalog intro"></section>
      <section class="mx-auto max-w-7xl px-4 py-section sm:px-6 lg:px-8 md:py-section-lg" aria-label="Products catalog">
        <div class="rounded-3xl bg-white/75 p-4 shadow-soft backdrop-blur sm:p-6 lg:p-8" data-products-controls></div>
        <div class="mt-10" data-products-summary aria-live="polite"></div>
        <div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" data-products-grid></div>
        <div class="mt-12" data-products-pagination></div>
      </section>
    </main>

    <footer class="bg-white" role="contentinfo">
      <div class="mx-auto min-h-32 max-w-7xl px-4 py-10 sm:px-6 lg:px-8"></div>
    </footer>
    <script type="module" src="/assets/js/navbar.js"></script>
    <script type="module" src="/assets/js/products.js"></script>
  </body>
</html>
