<article class="group flex h-full flex-col overflow-hidden rounded-3xl bg-white shadow-lg transition-all duration-300 ease-out hover:-translate-y-2">
  <div class="relative overflow-hidden">
    <img src="{{thumbnail}}" alt="{{name}}" class="aspect-square w-full object-cover transition-all duration-300 ease-out group-hover:scale-105" loading="lazy" decoding="async" data-fallback="{{fallback_thumbnail}}">
    <span class="{{badge_class}} absolute left-4 top-4 rounded-full bg-white/95 px-4 py-2 text-xs font-semibold uppercase tracking-[0.12em] text-chocolate shadow-soft backdrop-blur">{{badge_label}}</span>
  </div>
  <div class="flex flex-1 flex-col p-6">
    <p class="text-xs font-semibold uppercase tracking-[0.12em] text-chocolate/65">{{category_name}} • {{weight}}</p>
    <h3 class="mt-3 font-heading text-2xl font-semibold leading-tight text-darkBrown">{{name}}</h3>
    <p class="mt-3 flex-1 text-sm leading-6 text-darkBrown/65">{{short_description}}</p>
    <div class="mt-6 flex items-center justify-between gap-4">
      <p class="font-semibold text-chocolate">{{price}}</p>
      <a href="{{order_url}}" class="rounded-full bg-chocolate px-4 py-2 text-sm font-semibold text-white transition-all duration-300 ease-out hover:bg-darkBrown focus:outline-none focus:ring-2 focus:ring-chocolate focus:ring-offset-2" aria-label="{{order_aria_label}}">{{order_label}}</a>
    </div>
  </div>
</article>
